name: Deploy Docs Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # docs-site IS a pnpm workspace package here (see pnpm-workspace.yaml),
      # so its deps resolve from the root pnpm-lock.yaml. That also makes
      # upstream's npm@11 pin unnecessary — the npm 10.8 "edgesOut" resolver
      # crash on Nuxt's platform-gated oxc bindings is an npm bug pnpm never had.
      - name: Install dependencies
        working-directory: ./docs-site
        shell: bash
        run: |
          rm -rf node_modules
          pnpm install --no-frozen-lockfile

      - name: Copy additional files
        run: |
          # Copy README for reference
          cp README.md docs-site/public/README.md
          # Copy package.json for version info
          cp package.json docs-site/public/package.json

      - name: Build static site
        working-directory: ./docs-site
        run: pnpm generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
